name: GUI preview build

on:
  workflow_dispatch:
  push:
    branches: [gui]

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          python-version: "3.13"
      - run: uv sync --locked --group release
      - run: uv run --locked python -m unittest discover -s tests -q
      - name: Build gputaskman-gui.exe
        run: uv run --locked --group release pyinstaller --noconfirm --clean tools/portable_gui.spec
      - name: Check bundle and package
        shell: pwsh
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          $bundle = "dist\gputaskman-gui"
          $forbidden = "nvml.dll","nvcuda.dll","atiadlxx.dll","amd_smi.dll","dxgi.dll","pdh.dll"
          $bad = Get-ChildItem $bundle -Recurse -File | Where-Object { $forbidden -contains $_.Name.ToLower() }
          if ($bad) { throw "Driver libraries must not be bundled: $($bad.Name -join ', ')" }
          # The executable must match the target architecture (PE machine field).
          $bytes = [IO.File]::ReadAllBytes("$bundle\gputaskman-gui.exe")
          $pe = [BitConverter]::ToInt32($bytes, 60)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          $expected = @{ x64 = 0x8664; arm64 = 0xAA64 }[$env:BUILD_ARCH]
          if ($machine -ne $expected) { throw ("Wrong PE machine 0x{0:x4} for {1}" -f $machine, $env:BUILD_ARCH) }
          Copy-Item LICENSE, README.md $bundle
          $zip = "dist\gputaskman-gui-windows-$env:BUILD_ARCH.zip"
          Compress-Archive -Path $bundle -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $zip -Leaf) | Set-Content "$zip.sha256"
      - name: Smoke-test the frozen executable
        shell: pwsh
        run: |
          $p = Start-Process dist\gputaskman-gui\gputaskman-gui.exe -ArgumentList "--help" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "gputaskman-gui.exe --help exited with $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: gputaskman-gui-windows-${{ matrix.arch }}
          path: dist/gputaskman-gui-windows-${{ matrix.arch }}.zip*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    # Oldest supported Ubuntu: the frozen binary needs the build machine's glibc (2.35) or newer.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            elf: "3e"
          - arch: arm64
            runner: ubuntu-22.04-arm
            elf: "b7"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          python-version: "3.13"
      - run: uv sync --locked --group release
      - run: uv run --locked python -m unittest discover -s tests -q
      - name: Build gputaskman-gui
        run: uv run --locked --group release pyinstaller --noconfirm --clean tools/portable_gui.spec
      - name: Check bundle and package
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          ELF: ${{ matrix.elf }}
        run: |
          set -euo pipefail
          bundle=dist/gputaskman-gui
          if find "$bundle" -type f \( -name 'libnvidia-ml.so*' -o -name 'libcuda.so*' -o -name 'libamd_smi.so*' -o -name 'libdxcore.so*' \) | grep -q .; then
            echo "Driver libraries must not be bundled"; exit 1
          fi
          machine=$(od -An -tx1 -j18 -N1 "$bundle/gputaskman-gui" | tr -d ' ')
          [ "$machine" = "$ELF" ] || { echo "Wrong ELF machine $machine for $BUILD_ARCH"; exit 1; }
          cp LICENSE README.md "$bundle/"
          name=gputaskman-gui-linux-$BUILD_ARCH
          mv "$bundle" "dist/$name"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          "dist/$name/gputaskman-gui" --help
      - uses: actions/upload-artifact@v4
        with:
          name: gputaskman-gui-linux-${{ matrix.arch }}
          path: dist/gputaskman-gui-linux-${{ matrix.arch }}.tar.gz*
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          python-version: "3.13"
      - run: uv sync --locked --group release
      - run: uv run --locked python -m unittest discover -s tests -q
      - name: Build gputaskman-gui.app
        run: uv run --locked --group release pyinstaller --noconfirm --clean tools/portable_gui.spec
      - name: Check bundle and package
        run: |
          set -euo pipefail
          app=dist/gputaskman-gui.app
          exe="$app/Contents/MacOS/gputaskman-gui"
          lipo -archs "$exe" | grep -qw arm64 || { echo "Not an arm64 executable"; exit 1; }
          "$exe" --help
          mkdir -p dist/pkg && ditto "$app" dist/pkg/gputaskman-gui.app && cp LICENSE README.md dist/pkg/
          name=gputaskman-gui-macos-arm64
          ditto -c -k --keepParent dist/pkg "dist/$name.zip"
          (cd dist && shasum -a 256 "$name.zip" > "$name.zip.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: gputaskman-gui-macos-arm64
          path: dist/gputaskman-gui-macos-arm64.zip*
          if-no-files-found: error
